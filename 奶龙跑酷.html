<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小怪兽追追追 · 别被追上！</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0f16;font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;}
  #c{position:fixed;inset:0;display:block;}
  #danger{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5;
    background:radial-gradient(ellipse at center, rgba(255,0,0,0) 45%, rgba(255,40,40,.55) 100%);}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;z-index:10;background:rgba(10,14,20,.45);backdrop-filter:blur(3px);cursor:pointer;user-select:none;}
  .hidden{display:none !important;}
  h1{font-size:56px;margin:0 0 6px;letter-spacing:4px;color:#ffd23f;text-shadow:0 3px 0 #8a5a00,0 6px 14px rgba(0,0,0,.5);}
  .sub{font-size:17px;color:#dfe7f0;margin:8px 0 4px;line-height:1.7;}
  .keys{display:inline-block;background:#2a3544;border:1px solid #4a5768;border-radius:6px;padding:2px 9px;margin:0 2px;font-weight:600;color:#ffe9a8;}
  .hint{font-size:14px;color:#9fb2c6;margin-top:22px;animation:blink 1.4s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  #hint2{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:12;display:none;text-align:center;
    color:#fff;background:rgba(0,0,0,.55);padding:14px 26px;border-radius:14px;pointer-events:none;}
  #hint2 .t{font-size:22px;font-weight:700;color:#ffd23f;margin-bottom:4px;}
  #hint2 .s{font-size:14px;color:#cfe0f0;}
  #hud{position:fixed;top:16px;left:16px;z-index:9;pointer-events:none;user-select:none;
    color:#fff;background:rgba(8,14,22,.55);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:12px 16px;backdrop-filter:blur(4px);min-width:120px;}
  #hud .row{display:flex;align-items:baseline;gap:8px;line-height:1.9;}
  #hud .lab{color:#9fb2c6;font-size:12px;width:30px;}
  #hud .val{font-weight:700;color:#ffd23f;font-size:19px;font-variant-numeric:tabular-nums;}
  #hud .unit{color:#8ba3ba;font-size:12px;}
  /* 开始菜单 */
  #start{cursor:default;}
  #start h1{font-size:42px;margin-bottom:2px;}
  .menuSub{font-size:15px;color:#cfe0f0;margin:2px 0 12px;}
  .menuBlock{margin:8px 0;}
  .menuLabel{font-size:15px;font-weight:700;color:#ffe9a8;margin-bottom:8px;}
  .cardRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .levelCard,.skinCard{background:rgba(20,28,38,.72);border:2px solid rgba(255,255,255,.14);
    border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s;min-width:120px;}
  .levelCard:hover,.skinCard:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.4);}
  .levelCard.selected,.skinCard.selected{border-color:#ffd23f;background:rgba(52,44,16,.55);box-shadow:0 0 0 2px #ffd23f inset;}
  .thumb{width:110px;height:66px;border-radius:10px;margin:0 auto 8px;box-shadow:0 3px 8px rgba(0,0,0,.35);}
  .skinBall{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;box-shadow:0 3px 8px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.35);}
  .cardName{font-size:16px;font-weight:700;color:#fff;}
  .cardDesc{font-size:12px;color:#9fb2c6;margin-top:2px;}
  .startBtn{margin-top:16px;font-size:20px;font-weight:700;color:#5a3d00;background:linear-gradient(180deg,#ffe27a,#ffc233);
    border:none;border-radius:30px;padding:12px 40px;cursor:pointer;letter-spacing:2px;
    box-shadow:0 4px 0 #c9861a,0 8px 16px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s;}
  .startBtn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #c9861a,0 10px 20px rgba(0,0,0,.4);}
  .startBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #c9861a,0 4px 8px rgba(0,0,0,.35);}
  .menuHint{font-size:13px;color:#9fb2c6;margin-top:12px;animation:blink 1.6s infinite;}
  .winBtns{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap;justify-content:center;}
  #win{background:rgba(12,22,16,.5);}
  .bgmBtn{font-size:15px;font-weight:700;color:#fff;background:rgba(40,52,68,.8);border:2px solid rgba(255,255,255,.25);
    border-radius:24px;padding:8px 20px;cursor:pointer;margin-top:12px;transition:border-color .12s;}
  .bgmBtn:hover{border-color:#ffd23f;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="danger"></div>

<div id="start" class="overlay">
  <h1>小怪兽追追追</h1>
  <div class="menuSub">选择关卡与皮肤，然后开始逃跑！</div>

  <div class="menuBlock">
    <div class="menuLabel">🏁 关卡选择</div>
    <div class="cardRow" id="levelRow">
      <div class="levelCard" data-level="0">
        <div class="thumb" style="background:linear-gradient(135deg,#8fd7a0,#3fae6a)"></div>
        <div class="cardName">简单</div>
        <div class="cardDesc">开阔跑道·容错高</div>
      </div>
      <div class="levelCard" data-level="1">
        <div class="thumb" style="background:linear-gradient(135deg,#ffd98a,#f0a030)"></div>
        <div class="cardName">普通</div>
        <div class="cardDesc">台阶浮台·连续跳跃</div>
      </div>
      <div class="levelCard" data-level="2">
        <div class="thumb" style="background:linear-gradient(135deg,#ff9a8a,#e04f3a)"></div>
        <div class="cardName">困难</div>
        <div class="cardDesc">窄台高落差·二段跳</div>
      </div>
    </div>
  </div>

  <div class="menuBlock">
    <div class="menuLabel">🎨 主角皮肤</div>
    <div class="cardRow" id="skinRow">
      <div class="skinCard" data-skin="0">
        <div class="skinBall" style="background:#8ecdf2"></div>
        <div class="cardName">薄荷奶豆</div>
      </div>
      <div class="skinCard" data-skin="1">
        <div class="skinBall" style="background:#ffd23f"></div>
        <div class="cardName">小黄人</div>
      </div>
    </div>
  </div>

  <button id="startBtn" class="startBtn">开始游戏 ▶</button>
  <button id="bgmBtn" class="bgmBtn">🔊 音效：开</button>
  <div class="menuHint">也可直接按任意键开始 · WASD移动 · 空格二段跳</div>
</div>

<div id="hint2">
  <div class="t">😆 被小怪兽抓住了！</div>
  <div class="s" id="stat">—</div>
</div>

<div id="win" class="overlay hidden">
  <h1 style="color:#7dffb0;text-shadow:0 3px 0 #1f7a45,0 6px 14px rgba(0,0,0,.5)">🎉 通关！</h1>
  <div class="sub" id="statWin" style="font-size:18px;color:#eafff2">—</div>
  <div class="winBtns">
    <button id="winRetryBtn" class="startBtn">再来一次</button>
    <button id="winMenuBtn" class="startBtn" style="background:linear-gradient(180deg,#9fd8ff,#5aa8d8)">回到菜单</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="row"><span class="lab">距离</span><span class="val" id="hDist">0</span><span class="unit">m</span></div>
  <div class="row"><span class="lab">时间</span><span class="val" id="hTime">0</span><span class="unit">s</span></div>
  <div class="row"><span class="lab">金币</span><span class="val" id="hCoin">0</span></div>
  <div class="row"><span class="lab">最高</span><span class="val" id="hBest">0</span><span class="unit">m</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- 基础设置 ----------
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8ecdf2);
  scene.fog = new THREE.Fog(0x8ecdf2, 30, 140);

  const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x9a8f76, 0.95);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(24, 34, 12);
  scene.add(sun);

  const sunMesh = new THREE.Mesh(new THREE.BoxGeometry(8,8,1), new THREE.MeshBasicMaterial({color:0xfff2a8}));
  sunMesh.position.set(-46, 58, -70);
  scene.add(sunMesh);

  // ---------- 常量 ----------
  const RUN_SPEED = 6.0;
  const JUMP_V = 12.0;
  const GRAV = 30.0;
  const SPRING_V = 15.0;
  const HW_P = 0.30, HD_P = 0.30, PH = 1.7;
  const CAM_DIST = 7.6, CAM_HEIGHT = 3.2;
  const MAX_LAG = 6.0;
  const KILL_Y = -14;
  const PITCH_MIN = -0.50, PITCH_MAX = 0.90;
  const CHASE_SPEED = 5.9, CHASE_JUMP_V = 12.0;   // 追击速度(小幅提升, 保留拉扯空间)
  const CHASE_HW = 0.42, CHASE_HD = 0.42, CHASE_PH = 1.7;
  const CATCH_DIST = 1.15;
  const DOUBLE_JUMP_V = 13.5;                     // 二段跳(略高于单跳, 带轻微滞空)
  const FINISH_Z = 200;                           // 终点距离(约200米)

  // ---------- 材质 ----------
  const matPath  = new THREE.MeshLambertMaterial({color:0xf7e8cd});   // 主路(奶油)
  const matPathB = new THREE.MeshLambertMaterial({color:0xecd9b8});   // 分支路
  const matVoid  = new THREE.MeshLambertMaterial({color:0x1b2530});
  const matSpring= new THREE.MeshLambertMaterial({color:0xff4fd8});   // 弹板
  const candyMats= [new THREE.MeshLambertMaterial({color:0xff8fb1}),
                    new THREE.MeshLambertMaterial({color:0x7fd0ff}),
                    new THREE.MeshLambertMaterial({color:0xffc26e}),
                    new THREE.MeshLambertMaterial({color:0x9be07f}),
                    new THREE.MeshLambertMaterial({color:0xc6a6ff}),
                    new THREE.MeshLambertMaterial({color:0xff9a76})];
  const landMats = [new THREE.MeshLambertMaterial({color:0xe05353}),
                    new THREE.MeshLambertMaterial({color:0x4f7fe0}),
                    new THREE.MeshLambertMaterial({color:0xf0c030}),
                    new THREE.MeshLambertMaterial({color:0x9a5fd0})];
  const matFlower= [new THREE.MeshLambertMaterial({color:0xe84848}),
                    new THREE.MeshLambertMaterial({color:0xf0c030}),
                    new THREE.MeshLambertMaterial({color:0xffffff})];
  // 角色材质
  const darkM = new THREE.MeshLambertMaterial({color:0x2a2a2a});
  const blueM  = new THREE.MeshLambertMaterial({color:0x8ecdf2, side:THREE.DoubleSide});  // 主角天蓝(与天空同色, 双面, 避免面剔除/局部消失)
  const leafM  = new THREE.MeshLambertMaterial({color:0x62c26a});                         // 主角头顶嫩芽
  const creamM = new THREE.MeshLambertMaterial({color:0xfff3c4});
  const whiteM = new THREE.MeshLambertMaterial({color:0xffffff});
  const pinkM  = new THREE.MeshLambertMaterial({color:0xffa4b4});
  const silverM= new THREE.MeshLambertMaterial({color:0x9aa4b2});   // 护目镜框
  // 追击者·奶龙材质(黄色圆胖小龙)
  const yellowM = new THREE.MeshPhongMaterial({color:0xffd23f, shininess:80, specular:0x555555});  // 亮黄身体(光滑塑胶)
  const greenM  = new THREE.MeshPhongMaterial({color:0x3fb45a, shininess:95, specular:0x666666});  // 绿色大眼
  const mouthM  = new THREE.MeshPhongMaterial({color:0x7a3a1e, shininess:30, specular:0x222222});  // 嘴/鼻
  const dragonBellyM = new THREE.MeshPhongMaterial({color:0xfff3c4, shininess:55, specular:0x444444});  // 奶白肚皮(独立材质, 不受皮肤影响)
  const tongueM = new THREE.MeshPhongMaterial({color:0xff7d8a, shininess:50, specular:0x333333});  // 大笑小舌头

  const voidFloor = new THREE.Mesh(new THREE.BoxGeometry(4000, 1, 8000), matVoid);
  voidFloor.position.set(0, -26.5, -4000);
  scene.add(voidFloor);

  // ---------- 通用圆润网格 ----------
  function sphere(r, mat){ return new THREE.Mesh(new THREE.SphereGeometry(r, 36, 28), mat); }
  function ellipsoid(rx,ry,rz, mat){ const m = sphere(1, mat); m.scale.set(rx,ry,rz); return m; }
  function torus(r, tube, mat){ return new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, 28), mat); }
  function put(parent, mesh, x, y, z){ mesh.position.set(x, y, z); parent.add(mesh); return mesh; }

  // ---------- 主角: 圆滚滚薄荷奶豆(原创设计, 大头小身子 + 头顶嫩芽) ----------
  const P = {x:0, y:1, z:0, vy:0, onGround:true};
  const PR = {};
  (function buildPlayer(){
    PR.root = new THREE.Group(); scene.add(PR.root);
    PR.body = new THREE.Group(); PR.body.position.y = 0.62; PR.root.add(PR.body);
    // 头(薄荷蓝大圆头)
    put(PR.body, sphere(0.5, blueM), 0, 0.62, 0);
    // 头顶嫩芽(原创小装饰, 皮肤可隐藏)
    PR.leaf = new THREE.Group(); PR.body.add(PR.leaf);
    put(PR.leaf, ellipsoid(0.035,0.13,0.035, leafM), 0, 1.18, 0);
    const leaf = ellipsoid(0.13,0.06,0.03, leafM); leaf.position.set(0.09,1.26,0); leaf.rotation.z = -0.5; PR.leaf.add(leaf);
    // 脸(正面: 大眼 + 高光 + 腮红 + 微笑)
    PR.eyeL = sphere(0.13, whiteM); PR.eyeL.position.set(-0.18,0.68,0.43); PR.body.add(PR.eyeL);
    PR.eyeR = sphere(0.13, whiteM); PR.eyeR.position.set(0.18,0.68,0.43); PR.body.add(PR.eyeR);
    PR.pupL = sphere(0.075, darkM); PR.pupL.position.set(-0.18,0.67,0.53); PR.body.add(PR.pupL);
    PR.pupR = sphere(0.075, darkM); PR.pupR.position.set(0.18,0.67,0.53); PR.body.add(PR.pupR);
    put(PR.pupL, sphere(0.028, whiteM), 0.03, 0.045, 0.035);
    put(PR.pupR, sphere(0.028, whiteM), -0.03, 0.045, 0.035);
    PR.mouth = ellipsoid(0.09,0.05,0.03, darkM); PR.mouth.position.set(0,0.46,0.46); PR.body.add(PR.mouth);
    put(PR.body, ellipsoid(0.11,0.07,0.035, pinkM), -0.3, 0.5, 0.38);
    put(PR.body, ellipsoid(0.11,0.07,0.035, pinkM), 0.3, 0.5, 0.38);
    // 躯干(圆滚滚小身子 + 奶白肚皮)
    put(PR.body, ellipsoid(0.36,0.34,0.32, blueM), 0, 0.05, 0);
    put(PR.body, ellipsoid(0.24,0.22,0.1, creamM), 0, -0.05, 0.28);
    // 手臂(短圆)
    PR.armL = new THREE.Group(); PR.armL.position.set(-0.36,0.06,0); PR.body.add(PR.armL);
    put(PR.armL, ellipsoid(0.13,0.2,0.13, blueM), 0, -0.18, 0);
    put(PR.armL, sphere(0.09, blueM), 0, -0.36, 0);
    PR.armR = new THREE.Group(); PR.armR.position.set(0.36,0.06,0); PR.body.add(PR.armR);
    put(PR.armR, ellipsoid(0.13,0.2,0.13, blueM), 0, -0.18, 0);
    put(PR.armR, sphere(0.09, blueM), 0, -0.36, 0);
    // 腿(短圆小脚)
    PR.legL = new THREE.Group(); PR.legL.position.set(-0.16,-0.3,0); PR.body.add(PR.legL);
    put(PR.legL, ellipsoid(0.17,0.17,0.17, blueM), 0, -0.08, 0);
    PR.legR = new THREE.Group(); PR.legR.position.set(0.16,-0.3,0); PR.body.add(PR.legR);
    put(PR.legR, ellipsoid(0.17,0.17,0.17, blueM), 0, -0.08, 0);
    // 护目镜(小黄人皮肤专用, 默认隐藏): 绕头绑带 + 两只镜框
    PR.goggle = new THREE.Group(); PR.body.add(PR.goggle); PR.goggle.visible = false;
    const strap = torus(0.5, 0.07, darkM); strap.rotation.x = Math.PI/2; strap.position.set(0, 0.66, 0); PR.goggle.add(strap);
    const rimL = torus(0.13, 0.035, silverM); rimL.position.set(-0.18, 0.68, 0.47); PR.goggle.add(rimL);
    const rimR = torus(0.13, 0.035, silverM); rimR.position.set(0.18, 0.68, 0.47); PR.goggle.add(rimR);
  })();

  // ---------- 追击者: 奶龙(黄色圆胖小龙, 完整全身骨骼模型) ----------
  const DR = {};
  const dragonRoot = new THREE.Group(); scene.add(dragonRoot);
  const chaserP = {x:0, y:1, z:7, vy:0, onGround:true, face:Math.PI, jumps:0};
  (function buildDragon(){
    DR.b = new THREE.Group(); DR.b.position.y = 0.7; dragonRoot.add(DR.b);
    // 身体(亮黄圆滚滚胖身子)
    put(DR.b, ellipsoid(0.5,0.5,0.5, yellowM), 0, 0, 0);
    DR.belly = ellipsoid(0.38,0.4,0.24, dragonBellyM); DR.belly.position.set(0,-0.04,0.26); DR.b.add(DR.belly);
    // 大头(脑袋比身体大, 圆圆脸蛋)
    DR.headG = new THREE.Group(); DR.headG.position.set(0,0.42,0.0); DR.b.add(DR.headG);
    DR.head = sphere(0.62, yellowM); DR.headG.add(DR.head);
    // 短短的粗眉毛
    DR.browL = ellipsoid(0.14,0.055,0.04, darkM); DR.browL.position.set(-0.24,0.26,0.48); DR.headG.add(DR.browL);
    DR.browR = ellipsoid(0.14,0.055,0.04, darkM); DR.browR.position.set(0.24,0.26,0.48); DR.headG.add(DR.browR);
    // 圆圆的大绿眼睛 + 小白高光
    DR.eyeL = sphere(0.15, greenM); DR.eyeL.position.set(-0.24,0.06,0.5); DR.headG.add(DR.eyeL);
    DR.eyeR = sphere(0.15, greenM); DR.eyeR.position.set(0.24,0.06,0.5); DR.headG.add(DR.eyeR);
    DR.pupL = sphere(0.05, whiteM); DR.pupL.position.set(0.05,0.06,0.13); DR.eyeL.add(DR.pupL);
    DR.pupR = sphere(0.05, whiteM); DR.pupR.position.set(-0.05,0.06,0.13); DR.eyeR.add(DR.pupR);
    // 眯眼用眼皮(默认在上方, 大笑时下压)
    DR.lidL = ellipsoid(0.16,0.06,0.05, yellowM); DR.lidL.position.set(-0.24,0.2,0.52); DR.headG.add(DR.lidL);
    DR.lidR = ellipsoid(0.16,0.06,0.05, yellowM); DR.lidR.position.set(0.24,0.2,0.52); DR.headG.add(DR.lidR);
    // 小小的鼻头
    put(DR.headG, sphere(0.05, mouthM), 0, -0.04, 0.6);
    // 嘴(微笑, 大笑时张开 + 吐小舌头)
    DR.mouth = ellipsoid(0.14,0.06,0.08, mouthM); DR.mouth.position.set(0,-0.16,0.52); DR.headG.add(DR.mouth);
    DR.tongue = ellipsoid(0.08,0.06,0.05, tongueM); DR.tongue.position.set(0,-0.21,0.53); DR.tongue.visible = false; DR.headG.add(DR.tongue);
    // 腮红
    put(DR.headG, ellipsoid(0.12,0.09,0.05, pinkM), -0.36, -0.1, 0.48);
    put(DR.headG, ellipsoid(0.12,0.09,0.05, pinkM), 0.36, -0.1, 0.48);
    // 手臂(短小圆润 + 小手)
    DR.armL = new THREE.Group(); DR.armL.position.set(-0.5,0.02,0.04); DR.b.add(DR.armL);
    put(DR.armL, ellipsoid(0.14,0.2,0.14, yellowM), 0, -0.18, 0);
    put(DR.armL, sphere(0.1, yellowM), 0, -0.34, 0);
    DR.armR = new THREE.Group(); DR.armR.position.set(0.5,0.02,0.04); DR.b.add(DR.armR);
    put(DR.armR, ellipsoid(0.14,0.2,0.14, yellowM), 0, -0.18, 0);
    put(DR.armR, sphere(0.1, yellowM), 0, -0.34, 0);
    // 腿(短小圆润)
    DR.legL = new THREE.Group(); DR.legL.position.set(-0.2,-0.4,0); DR.b.add(DR.legL);
    put(DR.legL, ellipsoid(0.15,0.16,0.15, yellowM), 0, -0.05, 0);   // 大腿(圆润)
    DR.footL = ellipsoid(0.14,0.09,0.2, yellowM); DR.footL.position.set(0,-0.18,0.07); DR.legL.add(DR.footL);  // 脚掌
    DR.legR = new THREE.Group(); DR.legR.position.set(0.2,-0.4,0); DR.b.add(DR.legR);

  let AC = null;
  function audio(){

  function tone(freq, dur, type, vol, slideTo, when){
    const ac = audio(); if(!ac) return;
    const t = ac.currentTime + (when||0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+dur+0.05);
  }

    switch(e.code){
      case 'KeyW': case 'ArrowUp':    keys.w=true; break;
      case 'KeyA': case 'ArrowLeft':  keys.a=true; break;
      case 'KeyS': case 'ArrowDown':  keys.s=true; break;
      case 'KeyD': case 'ArrowRight': keys.d=true; break;
      case 'Space': keys.space=true; if(!e.repeat) spacePressed=true; e.preventDefault(); break;
    }
    if(state==='menu'){ startGame(); return; }
    if(state==='caught' && laughT>0.8 && (e.code==='Space'||e.code==='KeyR'||e.code==='Enter')){
      backToMenu();
    }
  });
  addEventListener('keyup', e=>{
    switch(e.code){
      case 'KeyW': case 'ArrowUp':    keys.w=false; break;
      case 'KeyA': case 'ArrowLeft':  keys.a=false; break;
      case 'KeyS': case 'ArrowDown':  keys.s=false; break;
      case 'KeyD': case 'ArrowRight': keys.d=false; break;
      case 'Space': keys.space=false; break;
    }
  });

  let yaw = 0, pitch = 0.28;   // 固定视角(鼠标不控制相机)

  const startEl = document.getElementById('start');
  const hint2El = document.getElementById('hint2');
  const statEl = document.getElementById('stat');
  const dangerEl = document.getElementById('danger');
  const winEl = document.getElementById('win');
  const statWin = document.getElementById('statWin');

  let selectedLevel = 0, selectedSkin = 0;

  function startGame(){
    audio();
    applySkin(selectedSkin);
    DIFF = LEVELS[selectedLevel];
    reset();
    startEl.classList.add('hidden');
    winEl.classList.add('hidden');
    startBGM('play');
  }
  function backToMenu(){
    reset();
    state = 'menu';
    startEl.classList.remove('hidden');
    hudEl.classList.add('hidden');
    hint2El.classList.add('hidden');
    winEl.classList.add('hidden');
    startBGM('menu');
  }

  // 关卡/皮肤选择(点击卡片选择, 不触发开始)
  document.querySelectorAll('.levelCard').forEach(card=>{
    card.addEventListener('click', e=>{
      e.stopPropagation();
      audio(); startBGM('menu');   // 首次交互解锁音频并播放菜单BGM
      selectedLevel = +card.dataset.level;
      document.querySelectorAll('.levelCard').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });
  document.querySelectorAll('.skinCard').forEach(card=>{
    card.addEventListener('click', e=>{
      e.stopPropagation();
      audio(); startBGM('menu');   // 首次交互解锁音频并播放菜单BGM
      selectedSkin = +card.dataset.skin;
      document.querySelectorAll('.skinCard').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      applySkin(selectedSkin);   // 菜单里实时预览皮肤
    });
  });
  document.getElementById('startBtn').addEventListener('click', e=>{
    e.stopPropagation();
    startGame();
  });
  document.getElementById('winRetryBtn').addEventListener('click', e=>{
    e.stopPropagation();
    winEl.classList.add('hidden');
    startGame();
  });
  document.getElementById('winMenuBtn').addEventListener('click', e=>{
    e.stopPropagation();
    winEl.classList.add('hidden');
    backToMenu();
  });
  document.getElementById('bgmBtn').addEventListener('click', e=>{
    e.stopPropagation();
    bgmEnabled = !bgmEnabled;
    updateBgmBtn();
    if(bgmEnabled){ audio(); startBGM('menu'); } else { stopBGM(); }
  });
  // 默认选中第一项
  document.querySelector('.levelCard').classList.add('selected');
  document.querySelector('.skinCard').classList.add('selected');

  // ---------- 工具 ----------
  const tmpV = new THREE.Vector3();
  function damp(cur,tgt,lam,dt){ return cur + (tgt-cur)*(1-Math.exp(-lam*dt)); }
  function dampAngle(cur,tgt,lam,dt){
    let d = Math.atan2(Math.sin(tgt-cur), Math.cos(tgt-cur));
    return cur + d*(1-Math.exp(-lam*dt));
  }

  // ---------- 状态 ----------
  let state = 'menu';
  let playTime = 0, runT = 0, chaseRunT = 0, clockT = 0;
  let targetFace = Math.PI, wasOnGround = true, landT = 0, coyote = 0, squash = 0;
  let laughT = 0, timeScale = 1, hintShown = false, caughtBaseY = 1;
  let jumps = 0, hoverT = 0, spacePressed = false;   // 二段跳
  let finishT = 0, finishPlaced = false, finishBaseY = 1, finishGroundY = 1;   // 终点

  // ---------- 碰撞 ----------
  function horizBlocked(){
    for(const s of solids){
      if(Math.abs(P.x-s.cx) < HW_P+s.hw && Math.abs(P.z-s.cz) < HD_P+s.hd){
        if(P.y < s.topY-0.001 && P.y+PH > s.botY+0.001) return true;
      }
    }
    return false;
  }

  // ---------- 主角动画 ----------
  function animatePlayer(moving){
    const ph = runT;
    if(!P.onGround){
      PR.legL.rotation.x = -0.7; PR.legR.rotation.x = -0.7;   // 跳跃收腿
      PR.armL.rotation.x = -1.4; PR.armR.rotation.x = -1.4;
      PR.body.rotation.x = 0.14;
      PR.body.position.y = 0.62;
    } else if(moving){
      PR.legL.rotation.x = Math.sin(ph)*0.72;                  // 双腿交替
      PR.legR.rotation.x = -Math.sin(ph)*0.72;
      PR.armL.rotation.x = -Math.sin(ph)*0.85;                 // 摆臂
      PR.armR.rotation.x = Math.sin(ph)*0.85;
      PR.body.position.y = 0.62 + Math.abs(Math.sin(ph))*0.06; // 起伏
      PR.body.rotation.x = 0.08;
    } else {
      PR.legL.rotation.x = 0; PR.legR.rotation.x = 0;
      PR.armL.rotation.x = 0.16; PR.armR.rotation.x = -0.16;
      PR.body.position.y = 0.62 + Math.sin(clockT*2.5)*0.02;
      PR.body.rotation.x = 0;
    }
    if(landT > 0){                                             // 落地缓冲下蹲
      const k = landT/0.18;
      PR.body.position.y -= k*0.12;
      PR.legL.rotation.x += k*0.4; PR.legR.rotation.x += k*0.4;
    }
  }

  // ---------- 玩家物理 ----------
  function stepPlayer(dt){
    const iz = (keys.w?1:0)-(keys.s?1:0);
    const ix = (keys.d?1:0)-(keys.a?1:0);
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let dx = fx*iz + rx*ix;
    let dz = fz*iz + rz*ix;
    const len = Math.hypot(dx,dz);
    if(len>1){ dx/=len; dz/=len; }
    const moving = len>0.01;

    const vx = dx*RUN_SPEED, vz = dz*RUN_SPEED;
    P.x += vx*dt; if(horizBlocked()) P.x -= vx*dt;
    P.z += vz*dt; if(horizBlocked()) P.z -= vz*dt;

    if(P.onGround){ jumps = 0; coyote = 0.12; } else coyote -= dt;   // 落地重置二段跳; 土狼时间
    if(spacePressed){
      if(P.onGround || coyote > 0){
        P.vy = JUMP_V; P.onGround = false; coyote = 0; jumps = 1; squash = -0.22; sfxJump();       // 第一段(地面)
      } else if(jumps < 2){
        P.vy = DOUBLE_JUMP_V; jumps = 2; hoverT = 0.22; squash = -0.26; sfxDoubleJump();          // 第二段(空中)
      }
    }
    spacePressed = false;
    const gMul = hoverT > 0 ? 0.72 : 1.0;                        // 二段跳轻微滞空
    P.vy -= GRAV * gMul * dt;
    if(hoverT > 0) hoverT -= dt;
    const prevY = P.y;
    P.y += P.vy*dt;
    P.onGround = false;
    for(const s of solids){
      if(Math.abs(P.x-s.cx) < HW_P+s.hw && Math.abs(P.z-s.cz) < HD_P+s.hd){
        if(P.vy <= 0 && prevY >= s.topY-0.06 && P.y <= s.topY+0.001){
          P.y=s.topY; P.vy=0; P.onGround=true;
          if(s.spring){ P.vy = SPRING_V; P.onGround = false; squash = -0.3; sfxSpring(); }   // 弹板弹飞
        }
      }
    }

    if(moving) targetFace = Math.atan2(dx, dz);
    PR.root.rotation.y = dampAngle(PR.root.rotation.y, targetFace, 12, dt);

    if(moving) runT += dt*14;
    if(P.onGround && !wasOnGround){ landT = 0.18; squash = 0.26; }
    wasOnGround = P.onGround;
    if(landT > 0) landT -= dt;
    squash += (0 - squash) * Math.min(1, dt*9);   // 挤压拉伸衰减

    animatePlayer(moving);
    PR.body.scale.set(1 + squash*0.35, 1 - squash*0.5, 1 + squash*0.35);
    PR.root.position.set(P.x, P.y, P.z);

    collectCoins();

    if(P.y < KILL_Y) triggerCaught();
  }

  // ---------- 追击者(奶龙)动画 ----------
  function animateDragonRun(){
    const ph = chaseRunT;
    DR.legL.rotation.x = Math.sin(ph)*0.6;      // 双腿交替跑动
    DR.legR.rotation.x = -Math.sin(ph)*0.6;
    DR.armL.rotation.x = -Math.sin(ph)*0.7;     // 手臂摆动
    DR.armR.rotation.x = Math.sin(ph)*0.7;
    DR.b.position.y = 0.7 + Math.abs(Math.sin(ph))*0.1;   // 身体起伏
    DR.headG.rotation.x = Math.sin(ph)*0.08;
    DR.tail.rotation.z = Math.sin(ph)*0.3;
  }
  function animateDragonJump(){
    DR.legL.rotation.x = -0.5; DR.legR.rotation.x = -0.5;   // 起跳收腿
    DR.armL.rotation.x = -1.2; DR.armR.rotation.x = -1.2;
    DR.tail.rotation.z = 0.4;
  }
  // ---------- 主角被抓时的惊慌动画 ----------
  function animatePlayerCaught(t){
    // 无奈/尴尬: 低头前倾, 手臂无力下垂, 轻轻叹气起伏
    PR.body.rotation.x = 0.16;                                     // 低头沮丧
    PR.body.position.y = 0.62 - Math.abs(Math.sin(t*2.2))*0.03;    // 叹气起伏
    PR.armL.rotation.x = 0.35; PR.armL.rotation.z = 0.18;          // 手臂无力耷拉
    PR.armR.rotation.x = 0.35; PR.armR.rotation.z = -0.18;
    PR.legL.rotation.x = 0; PR.legR.rotation.x = 0;
  }
  // ---------- 主角通关欢呼舞蹈(高举双手 + 原地跳跃 + 左右摇摆) ----------
  function animatePlayerWin(t){
    PR.armL.rotation.x = -2.6 + Math.sin(t*6)*0.2;   // 双手高举
    PR.armL.rotation.z = 0.5;
    PR.armR.rotation.x = -2.6 + Math.sin(t*6)*0.2;
    PR.armR.rotation.z = -0.5;
    PR.legL.rotation.x = Math.sin(t*7)*0.35;          // 原地交替跳
    PR.legR.rotation.x = -Math.sin(t*7)*0.35;
    PR.body.position.y = 0.62 + Math.abs(Math.sin(t*4.5))*0.2;  // 跳跃起伏
    PR.body.rotation.x = -0.08;
    PR.body.rotation.z = Math.sin(t*5)*0.16;          // 左右摇摆
  }
  function triggerCaught(){
    if(state !== 'playing') return;
    state = 'caught';
    laughT = 0; timeScale = 0.25; hintShown = false;
    dangerEl.style.opacity = 0;
    caughtBaseY = Math.max(1, P.y);
    saveBest(Math.max(0, Math.round(-P.z)));
    updateHUD();
    sfxCaught();
    bgmCaught();
    playDragonLaugh();
    // 主角与奶龙并排, 双双面向镜头(+Z)
    PR.root.position.set(P.x - 1.15, caughtBaseY, P.z);
    PR.root.rotation.y = 0;
    PR.body.rotation.set(0,0,0);
    dragonRoot.position.set(P.x + 1.15, caughtBaseY, P.z);
    dragonRoot.rotation.y = 0;
    DR.b.rotation.set(0,0,0);
    DR.headG.rotation.x = 0;
  }
  // ---------- 追击者 AI(自动寻路 + 真实物理: 能跑/能跳/跨台阶, 被地形碰撞阻挡) ----------
  function chaseHorizBlocked(){
    for(const s of solids){
      if(Math.abs(chaserP.x - s.cx) < CHASE_HW+s.hw && Math.abs(chaserP.z - s.cz) < CHASE_HD+s.hd){
        if(chaserP.y < s.topY-0.001 && chaserP.y+CHASE_PH > s.botY+0.001) return true;
      }
    }
    return false;
  }
  // 预判前方 dist 距离处是否被障碍阻挡(用于提前起跳)
  function chaseBlockedAhead(nx, nz, dist){
    const x = chaserP.x + nx*dist, z = chaserP.z + nz*dist;
    for(const s of solids){
      if(Math.abs(x - s.cx) < CHASE_HW+s.hw && Math.abs(z - s.cz) < CHASE_HD+s.hd){
        if(chaserP.y < s.topY-0.001 && chaserP.y+CHASE_PH > s.botY+0.001) return true;
      }
    }
    return false;
  }
  function chaseGroundAt(x, z, fromY, maxUp){
    let best = null;
    for(const s of solids){
      if(Math.abs(x - s.cx) < CHASE_HW + s.hw && Math.abs(z - s.cz) < CHASE_HD + s.hd){
        if(s.topY <= fromY + (maxUp||0.2) && s.topY >= fromY - 2.4){
          if(!best || s.topY > best.topY) best = s;
        }
      }
    }
    return best;
  }
  function stepChaser(dt){
    const dirx = P.x - chaserP.x, dirz = P.z - chaserP.z;
    const horiz = Math.hypot(dirx, dirz);
    const nx = horiz>0.001 ? dirx/horiz : 0;
    const nz = horiz>0.001 ? dirz/horiz : 0;
    if(horiz>0.001) chaserP.face = Math.atan2(dirx, dirz);

    const sp = CHASE_SPEED * Math.min(1.2, 0.85 + playTime*0.005);
    const mvx = nx*sp*dt, mvz = nz*sp*dt;
    let blockedX = false, blockedZ = false;
    chaserP.x += mvx; if(chaseHorizBlocked()){ chaserP.x -= mvx; blockedX = true; }
    chaserP.z += mvz; if(chaseHorizBlocked()){ chaserP.z -= mvz; blockedZ = true; }

    // 跳跃决策: 提前预判地形 + 二段跳(连贯骨骼动画, 无瞬移)
    if(chaserP.onGround){
      chaserP.jumps = 0;
      const gAhead = chaseGroundAt(chaserP.x + nx*2.0, chaserP.z + nz*2.0, chaserP.y, 0.4);
      const gNow   = chaseGroundAt(chaserP.x, chaserP.z, chaserP.y, 0.1);
      let wantJump = false;
      if(!gAhead) wantJump = true;                                         // 前方沟壑/断层
      else if(gNow && gAhead.topY > gNow.topY + 0.35) wantJump = true;      // 前方高台
      if(chaseBlockedAhead(nx, nz, 1.6)) wantJump = true;                   // 前方有墙(提前起跳)
      if(P.y > chaserP.y + 1.1) wantJump = true;                           // 玩家明显更高
      if(blockedX || blockedZ) wantJump = true;                             // 被障碍阻挡
      if(wantJump){ chaserP.vy = CHASE_JUMP_V; chaserP.onGround = false; chaserP.jumps = 1; }
    } else if(chaserP.jumps === 1 && chaserP.vy < 6.0){
      // 二段跳: 第一段跳跃到上升后期仍未越过障碍(宽沟/高墙)时, 追加第二跳
      const gAhead = chaseGroundAt(chaserP.x + nx*2.5, chaserP.z + nz*2.5, chaserP.y + 0.5, 0.5);
      let needSecond = false;
      if(!gAhead) needSecond = true;                                        // 宽沟: 前方仍无落地地面
      if(blockedX || blockedZ) needSecond = true;                            // 高墙: 仍被挡住
      if(needSecond){ chaserP.vy = DOUBLE_JUMP_V; chaserP.jumps = 2; }
    }

    // 重力 + 落地(与主角同一套碰撞)
    chaserP.vy -= GRAV*dt;
    const prevY = chaserP.y;
    chaserP.y += chaserP.vy*dt;
    chaserP.onGround = false;
    for(const s of solids){
      if(Math.abs(chaserP.x - s.cx) < CHASE_HW+s.hw && Math.abs(chaserP.z - s.cz) < CHASE_HD+s.hd){
        if(chaserP.vy <= 0 && prevY >= s.topY-0.06 && chaserP.y <= s.topY+0.001){
          chaserP.y = s.topY; chaserP.vy = 0; chaserP.onGround = true;
        }
      }
    }

    // 掉下去或落后太远: 在玩家身后不远处重新出现(保持追击压力)
    if(chaserP.y < KILL_Y || horiz > 16){
      chaserP.x = P.x - nx*3; chaserP.z = P.z - nz*3;
      chaserP.y = P.y; chaserP.vy = 0; chaserP.onGround = true;
    }

    dragonRoot.position.set(chaserP.x, chaserP.y, chaserP.z);
    dragonRoot.rotation.y = dampAngle(dragonRoot.rotation.y, chaserP.face, 8, dt);

    chaseRunT += dt*12;
    if(chaserP.onGround) animateDragonRun(); else animateDragonJump();

    const danger = Math.max(0, Math.min(1, (MAX_LAG - horiz)/MAX_LAG));
    dangerEl.style.opacity = (danger*0.6).toFixed(3);

    if(horiz < CATCH_DIST && Math.abs(P.y - chaserP.y) < 2.0) triggerCaught();
  }

  // ---------- 奶龙捧腹大笑(双手捂肚 + 身体抖动 + 头后仰 + 张嘴眯眼, 几秒后定格) ----------
  function animateDragonLaugh(t){
    DR.legL.rotation.x = 0; DR.legR.rotation.x = 0;              // 站稳

    // 三阶段: 0~0.3 停顿 -> 0.3~0.9 进入捧腹 -> >0.9 持续大笑定格
    const hold = Math.min(1, Math.max(0, (t - 0.3) / 0.6));      // 捧腹强度 0..1
    const shake = hold * Math.abs(Math.sin(t*7));                 // 身体上下抖动(大幅度)

    // 双手捂着肚子(向前抱向肚皮)
    DR.armL.rotation.x = -1.3 * hold; DR.armL.rotation.z = 0.55 * hold;
    DR.armR.rotation.x = -1.3 * hold; DR.armR.rotation.z = -0.55 * hold;

    // 身体大幅度上下抖动 + 轻微前倾
    DR.b.position.y = 0.7 + shake * 0.18;
    DR.b.rotation.x = -0.15 * hold;                                 // 身体后仰
    DR.headG.rotation.x = (-0.25 + Math.sin(t*3)*0.04) * hold;    // 头部后仰大笑

    // 脸: 张嘴大笑 + 吐舌 + 眯眼 + 挑眉
    const open = hold * (0.8 + 0.2 * Math.sin(t*9));
    DR.mouth.scale.set(0.14 + 0.03*open, 0.06 + 0.09*open, 0.08); // 张嘴(按原尺寸)
    DR.tongue.visible = hold > 0.3;
    DR.lidL.position.y = 0.2 - 0.1 * hold; DR.lidR.position.y = 0.2 - 0.1 * hold;  // 眯眼
    DR.browL.position.y = 0.26 + 0.04 * hold; DR.browR.position.y = 0.26 + 0.04 * hold; // 挑眉
    DR.tail.rotation.z = Math.sin(t*6) * 0.4 * hold;              // 快活摇尾
  }
  // ---------- 被抓结算 ----------
  function stepCaught(dt){
    laughT += dt;
    animatePlayerCaught(laughT);
    animateDragonLaugh(laughT);
    if(laughT > 1.0 && !hintShown){
      hintShown = true;
      statEl.textContent = '坚持了 ' + Math.round(playTime) + ' 秒 · 前进了 ' + Math.max(0, Math.round(-P.z)) + ' 米 · 金币 ×' + coinsGot + ' · 按 空格 / R 返回菜单';
      hint2El.classList.remove('hidden');
    }
  }
  // ---------- 通关结算 ----------
  function triggerFinish(){
    if(state !== 'playing') return;
    state = 'finished';
    finishT = 0; timeScale = 0.3; hintShown = false;
    dangerEl.style.opacity = 0;
    finishBaseY = finishGroundY;
    saveBest(Math.max(0, Math.round(-P.z)));
    updateHUD();
    sfxWin();
    startBGM('win');
    // 主角与奶龙并排面向镜头
    PR.root.position.set(P.x - 1.6, finishBaseY, P.z);
    PR.root.rotation.y = 0;
    PR.body.rotation.set(0,0,0);
    dragonRoot.position.set(P.x + 1.6, finishBaseY, P.z);
    dragonRoot.rotation.y = 0;
    DR.b.rotation.set(0,0,0);
    DR.headG.rotation.x = 0;
    // 庆祝粒子(礼花/花瓣/彩纸)
    celebrateBurst(P.x, finishBaseY, P.z);
    celebrateBurst(P.x - 2, finishBaseY + 0.5, P.z + 1);
    celebrateBurst(P.x + 2, finishBaseY + 0.5, P.z - 1);
  }
  function stepFinish(dt){
    finishT += dt;
    animatePlayerWin(finishT);
    animateDragonLaugh(finishT);
    if(finishT > 1.2 && !hintShown){
      hintShown = true;
      statWin.textContent = '用时 ' + Math.round(playTime) + ' 秒 · 距离 ' + Math.max(0, Math.round(-P.z)) + ' 米 · 金币 ×' + coinsGot;
      winEl.classList.remove('hidden');
    }
  }

  // ---------- 相机 ----------
  function updateCamera(dt){
    if(state === 'finished'){
      tmpV.set(P.x, finishBaseY + 2.3, P.z + 5.6);
      camera.position.lerp(tmpV, 1-Math.exp(-5*dt));
      camera.lookAt(P.x, finishBaseY + 1.4, P.z);
      return;
    }
    if(state === 'caught'){
      tmpV.set(P.x, caughtBaseY + 2.3, P.z + 5.6);
      camera.position.lerp(tmpV, 1-Math.exp(-5*dt));
      camera.lookAt(P.x, caughtBaseY + 1.25, P.z);
      return;
    }
    if(state === 'menu'){
      const ox = Math.sin(yaw)*Math.cos(pitch)*CAM_DIST;
      const oy = Math.sin(pitch)*CAM_DIST + CAM_HEIGHT;
      const oz = Math.cos(yaw)*Math.cos(pitch)*CAM_DIST;
      tmpV.set(ox, oy+1, oz);
      camera.position.lerp(tmpV, 1-Math.exp(-4*dt));
      camera.lookAt(0, 1.5, 0);
      return;
    }
    const ox = Math.sin(yaw)*Math.cos(pitch)*CAM_DIST;
    const oy = Math.sin(pitch)*CAM_DIST + CAM_HEIGHT;
    const oz = Math.cos(yaw)*Math.cos(pitch)*CAM_DIST;
    tmpV.set(P.x+ox, P.y+oy, P.z+oz);
    camera.position.lerp(tmpV, 1-Math.exp(-16*dt));
    camera.lookAt(P.x, P.y+1.5, P.z);
  }

  // ---------- 重置 ----------
  function reset(){
    for(const s of solids) scene.remove(s.mesh);
    solids.length = 0;
    for(const d of decos) scene.remove(d.mesh);
    decos.length = 0;
    for(const c of coins) scene.remove(c.mesh);
    coins.length = 0;
    for(const p of parts) scene.remove(p.m);
    parts.length = 0;
    for(const m of finishMeshes) scene.remove(m);
    finishMeshes.length = 0;
    finishBands.length = 0;
    coinsGot = 0;

    P.x=0; P.y=1; P.z=0; P.vy=0; P.onGround=true; wasOnGround=true;
    chaserP.x=0; chaserP.y=1; chaserP.z=7; chaserP.vy=0; chaserP.onGround=true; chaserP.face=Math.PI; chaserP.jumps=0;
    dragonRoot.position.set(0,1,7); dragonRoot.rotation.y=Math.PI;
    DR.b.position.y=0.7; DR.b.rotation.set(0,0,0); DR.headG.rotation.x=0;
    DR.mouth.scale.set(0.14,0.06,0.08); DR.tongue.visible=false;
    DR.lidL.position.set(-0.24,0.2,0.52); DR.lidR.position.set(0.24,0.2,0.52);
    DR.browL.position.set(-0.24,0.26,0.48); DR.browR.position.set(0.24,0.26,0.48);
    DR.armL.rotation.set(0,0,0); DR.armR.rotation.set(0,0,0);
    DR.legL.rotation.set(0,0,0); DR.legR.rotation.set(0,0,0);
    DR.tail.rotation.set(0,0,0);
    PR.root.rotation.y=Math.PI; PR.body.rotation.x=0; PR.body.position.y=0.62; PR.body.scale.set(1,1,1);
    PR.armL.rotation.set(0,0,0); PR.armR.rotation.set(0,0,0);
    PR.legL.rotation.set(0,0,0); PR.legR.rotation.set(0,0,0);
    keys.w=keys.a=keys.s=keys.d=keys.space=false;
    gh=1; px=0; genZ=-12; sinceLandmark=0; finishPlaced=false;
    addSolid(0, -6, 12, 1, 12, matPath, 1);
    generate();
    playTime=0; runT=0; chaseRunT=0; landT=0; targetFace=Math.PI; squash=0; coyote=0;
    jumps=0; hoverT=0; spacePressed=false;
    finishT=0;
    yaw=0; pitch=0.28; state='playing'; timeScale=1; laughT=0; hintShown=false;
    dangerEl.style.opacity = 0;
    hint2El.classList.add('hidden');
    winEl.classList.add('hidden');
    hudEl.classList.remove('hidden');
    updateHUD();
  }

  // ---------- 主循环 ----------
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const rawDt = Math.min(0.05, clock.getDelta());
    clockT += rawDt;

    if(state === 'playing'){
      const dt = rawDt;
      playTime += dt;
      stepPlayer(dt);
      stepChaser(dt);
      stepCoins(dt);
      stepParts(dt);
      generate();
      cull();
      stepFinishBands(dt);
      if(P.z <= -FINISH_Z) triggerFinish();
      updateHUD();
      updateCamera(dt);
    } else if(state === 'caught'){
      timeScale = Math.min(1, timeScale + rawDt*1.4);   // 短暂慢动作后恢复正常
      const dt = rawDt * timeScale;
      stepCaught(dt);
      stepParts(dt);
      updateCamera(dt);
    } else if(state === 'finished'){
      timeScale = Math.min(1, timeScale + rawDt*1.3);   // 通关慢动作
      const dt = rawDt * timeScale;
      stepFinish(dt);
      stepParts(dt);
      stepFinishBands(dt);
      updateCamera(dt);
    } else if(state === 'menu'){
      chaseRunT += rawDt*12;
      animateDragonRun();
      dragonRoot.position.set(2.4, 1, 1.2);
      dragonRoot.rotation.y = 0;
      PR.root.position.set(-2.4, 1, 0.6);
      PR.root.rotation.y = 0;
      animatePlayer(false);
      updateCamera(rawDt);
    }

    renderer.render(scene, camera);
  }

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  reset(); state = 'menu'; hudEl.classList.add('hidden');
  animate();
})();
</script>
</body>
</html>
